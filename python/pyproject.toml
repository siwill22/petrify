[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "petrify"
version = "0.14.0"
description = "Export plate reconstructions as web-ready JSON for deep-time maps"
requires-python = ">=3.9"
license = { text = "MIT" }

# pygplates and gprm are not on PyPI -- they come from the conda/GPlates stack, so they
# are deliberately not listed as installable dependencies. See the README for setup.
dependencies = [
    "numpy",
]

[project.optional-dependencies]
verify = ["pygmt"]

[project.scripts]
petrify-export = "petrify.export:main"
petrify-verify = "petrify.verify:main"
petrify-timeseries = "petrify.timeseries:main"

[tool.setuptools.packages.find]
include = ["petrify*", "geode*"]
