[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-time-map"
version = "0.9.0"
description = "Export plate reconstructions as web-ready JSON for deep-time maps"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# pygplates and gprm are not on PyPI -- they come from the conda/GPlates stack, so they
# are deliberately not listed as installable dependencies. See the README for setup.
dependencies = [
    "numpy",
]

[project.optional-dependencies]
verify = ["pygmt"]

[project.scripts]
deep-time-map-export = "deep_time_map.export:main"
deep-time-map-verify = "deep_time_map.verify:main"
deep-time-map-timeseries = "deep_time_map.timeseries:main"

[tool.setuptools.packages.find]
include = ["deep_time_map*", "geode*"]
